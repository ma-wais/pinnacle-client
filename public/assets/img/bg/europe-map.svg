<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Europe Map Background</title>
  <desc id="desc">Decorative stylized map of Europe for section background.</desc>
  <defs>
