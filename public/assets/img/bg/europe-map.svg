      <stop offset="0%" stop-color="#f0f1f4" />
      <stop offset="100%" stop-color="#e4e7eb" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#b9c0ca" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1600" height="700" fill="url(#sea)" />

